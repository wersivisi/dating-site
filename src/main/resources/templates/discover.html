<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Анкеты — swipely</title><link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}"></head><body><header class="header"><div class="header-inner"><a class="brand" href="/" th:href="@{/}"><span class="brand-mark">♡</span>swipely</a><nav class="app-nav"><a class="active" href="/discover" th:href="@{/discover}">Анкеты</a><a href="/likes" th:href="@{/likes}">Симпатии</a><a href="/messages" th:href="@{/messages}">Сообщения</a></nav><a class="user-nav" href="/my-profile" th:href="@{/my-profile}"><span class="avatar">♡</span>Мой профиль⌄</a></div></header><main class="app-main container"><p class="notice" role="alert" th:if="${error}" th:text="${error}"></p><p class="notice" role="status" th:if="${notice}" th:text="${notice}"></p><div class="heading"><p class="eyebrow">✦ ТВОИ ЛЮДИ ГДЕ-ТО РЯДОМ</p><h1>НАЙДИ СВОЙ ВАЙБ.</h1></div><form class="toolbar" th:action="@{/discover}" method="get"><label class="field search-wrap">Поиск<input class="search" name="q" type="search" th:value="${q}" placeholder="Имя, город или интерес"></label><label class="field">Город<select class="select" name="city"><option value="">Любой город</option><option th:selected="${city == 'Москва'}">Москва</option><option th:selected="${city == 'Санкт-Петербург'}">Санкт-Петербург</option></select></label><label class="field">Цель<select class="select" name="goal"><option value="">Любая цель</option><option value="relationship" th:selected="${goal == 'relationship'}">Отношения</option><option value="friendship" th:selected="${goal == 'friendship'}">Дружба и общение</option></select></label><button class="button">Показать анкеты</button></form><p class="notice" th:if="${#lists.isEmpty(profiles)}">Анкет пока нет. Попробуйте изменить фильтры.</p><div class="profile-grid"><article class="person-card" th:each="person : ${profiles}"><a class="person-photo" th:href="@{/profile(userId=${person.userId})}"><img th:if="${person.avatarUrl}" th:src="@{${person.avatarUrl}}" alt="Фото пользователя"><span th:unless="${person.avatarUrl}" class="photo-placeholder">♡</span></a><div class="person-info"><h3 th:text="${person.displayName}"></h3><p th:text="${person.city}"></p><p th:text="${person.bio}"></p><div class="chips"><span th:text="${person.interests}"></span></div></div><form method="post" th:action="@{/friends/{id}/like(id=${person.userId})}"><button class="button card-cta" type="submit">♡ Нравится</button></form></article></div></main><footer class="footer"><div class="footer-inner"><span>© 2026 swipely　 18+ · Только для совершеннолетних</span><div class="footer-links"><a href="/safety" th:href="@{/safety}">Безопасность</a><a href="/help" th:href="@{/help}">Помощь</a></div></div></footer></body></html>
