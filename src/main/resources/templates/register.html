<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Создать аккаунт — swipely</title>
  <!-- Подключение таблицы стилей -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ШАПКА СТРАНИЦЫ АВТОРИЗАЦИИ -->
  <header class="header">
    <div class="header-inner">
      <!-- Навигация: Главная страница (логотип) -->
      <a class="brand" href="index.html">
        <span class="brand-mark">♡</span>swipely
      </a>
      <!-- Ссылка возврата на главную страницу -->
      <a href="index.html" style="color:var(--muted);font-size:12px">← На главную</a>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ: ФОРМА РЕГИСТРАЦИИ -->
  <main class="auth-wrap">
    <section class="auth-card">
      <p class="eyebrow">✦ НАЧНИ НА СВОЕЙ ВОЛНЕ</p>
      <h1>СОЗДАТЬ АККАУНТ</h1>
      <p>Добро пожаловать в swipely. Начни свою историю.</p>
      
      <!-- 
        ФОРМА РЕГИСТРАЦИИ НОВОГО ПОЛЬЗОВАТЕЛЯ 
        (POST-запрос для создания учетной записи) 
      -->
      <form class="auth-form" method="post">
        
        <!-- Поле ввода имени (Параметр: name) -->
        <label>Имя
          <input name="name" required autocomplete="name" placeholder="Как тебя зовут?">
        </label>
        
        <!-- Поле ввода электронной почты (Параметр: email) -->
        <label>Электронная почта
          <input name="email" type="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        
        <!-- Поле ввода пароля (Параметр: password) -->
        <label>Пароль
          <input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Не менее 8 символов">
        </label>
        <small style="color:var(--muted)">Не менее 8 символов, включая буквы и цифры.</small>
        
        <!-- Чекбокс подтверждения возраста 18+ (Обязательное поле) -->
        <label style="display:flex;align-items:flex-start;gap:9px">
          <input type="checkbox" required> Мне исполнилось 18 лет
        </label>
        
        <!-- Чекбокс принятия условий и политики -->
        <label style="display:flex;align-items:flex-start;gap:9px">
          <input type="checkbox" required> 
          Я принимаю <a class="text-link" href="terms.html">Условия использования</a> и соглашаюсь с <a class="text-link" href="privacy.html">Политикой конфиденциальности</a>
        </label>
        
        <!-- Кнопка отправки POST-запроса регистрации -->
        <button class="button" type="submit">Зарегистрироваться ↗</button>
        
        <!-- Ссылка на страницу входа для существующих пользователей -->
        <p class="auth-foot">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      </form>

      <p class="auth-motto">— ТВОЙ ЧЕЛОВЕК. ТВОЙ ВАЙБ. —</p>
    </section>
  </main>

  <!-- ПОДВАЛ СТРАНИЦЫ -->
  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 swipely  18+ · Только для совершеннолетних</span>
      <div class="footer-links">
        <!-- Ссылка: Политика конфиденциальности -->
        <a href="privacy.html">Конфиденциальность</a>
        <!-- Ссылка: Условия использования -->
        <a href="terms.html">Условия</a>
      </div>
    </div>
  </footer>

</body>
</html>
