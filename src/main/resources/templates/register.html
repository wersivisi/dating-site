<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Создать аккаунт — swipely</title><link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}"></head><body><header class="header"><div class="header-inner"><a class="brand" href="/" th:href="@{/}"><span class="brand-mark">♡</span>swipely</a><a href="/" th:href="@{/}" style="color:var(--muted);font-size:12px">← На главную</a></div></header><main class="auth-wrap"><p class="notice" role="alert" th:if="${error}" th:text="${error}"></p><p class="notice" role="status" th:if="${notice}" th:text="${notice}"></p><section class="auth-card"><p class="eyebrow">✦ НАЧНИ НА СВОЕЙ ВОЛНЕ</p><h1>СОЗДАТЬ АККАУНТ</h1><p>Добро пожаловать в swipely. Начни свою историю.</p><form class="auth-form" method="post" th:action="@{/register}"><label>Имя<input name="username" minlength="4" maxlength="100" th:value="${registration.username}" required autocomplete="name" placeholder="Как тебя зовут?"></label><label>Электронная почта<input name="email" th:value="${registration.email}" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Пароль<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Не менее 8 символов"></label><small style="color:var(--muted)">Не менее 8 символов.</small><label style="display:flex;align-items:flex-start;gap:9px"><input type="checkbox" name="adult" value="true" required> Мне исполнилось 18 лет</label><label style="display:flex;align-items:flex-start;gap:9px"><input type="checkbox" name="terms" value="true" required> Я принимаю <a class="text-link" href="/terms" th:href="@{/terms}">Условия использования</a> и соглашаюсь с <a class="text-link" href="/privacy" th:href="@{/privacy}">Политикой конфиденциальности</a></label><button class="button" type="submit">Зарегистрироваться ↗</button><p class="auth-foot">Уже есть аккаунт? <a href="/login" th:href="@{/login}">Войти</a></p></form><p class="auth-motto">— ТВОЙ ЧЕЛОВЕК. ТВОЙ ВАЙБ. —</p></section></main><footer class="footer"><div class="footer-inner"><span>© 2026 swipely　 18+ · Только для совершеннолетних</span><div class="footer-links"><a href="/privacy" th:href="@{/privacy}">Конфиденциальность</a><a href="/terms" th:href="@{/terms}">Условия</a></div></div></footer></body></html>
