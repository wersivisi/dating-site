<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>Создать аккаунт — swipely</title>
    <link href="/css/styles.css" rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script defer="" th:src="@{/js/site.js}"></script>
  </head>

  <body>

    <header class="header">
      <div class="header-inner">
        <a class="brand" href="/" th:href="@{/}"><span class="brand-mark">♡</span>swipely</a>
        <a href="/" style="color:var(--muted);font-size:12px" th:href="@{/}">← На главную</a>
      </div>
    </header>

    <main class="auth-wrap">
      <p class="notice" role="alert" th:if="${error}" th:text="${error}"></p>
      <p class="notice" role="status" th:if="${notice}" th:text="${notice}"></p>

      <section class="auth-card">
        <p class="eyebrow">ШАГ 1 ИЗ 2 · РЕГИСТРАЦИЯ</p>
        <h1>СОЗДАТЬ АККАУНТ</h1>
        <p>Добро пожаловать в swipely. Начни свою историю.</p>

        <form class="auth-form" method="post" th:action="@{/register}">
          <label>
            Имя
            <input autocomplete="name" maxlength="100" minlength="4" name="username" placeholder="Как тебя зовут?" required="" th:value="${registration.username}"/>
          </label>
          <label>
            Электронная почта
            <input autocomplete="email" name="email" placeholder="you@example.com" required="" th:value="${registration.email}" type="email"/>
          </label>
          <label>
            Пароль
            <input autocomplete="new-password" minlength="8" name="password" placeholder="Не менее 8 символов" required="" type="password"/>
          </label>
          <small style="color:var(--muted)">Не менее 8 символов.</small>
          <label style="display:flex;align-items:flex-start;gap:9px">
            <input name="adult" required="" type="checkbox" value="true"/>
            Мне исполнилось 18 лет
          </label>
          <label style="display:flex;align-items:flex-start;gap:9px">
            <input name="terms" required="" type="checkbox" value="true"/>
            Я принимаю
            <a class="text-link" href="/terms" th:href="@{/terms}">Условия использования</a>
            и соглашаюсь с
            <a class="text-link" href="/privacy" th:href="@{/privacy}">Политикой конфиденциальности</a>
          </label>
          <button class="button" type="submit">Зарегистрироваться ↗</button>
          <p class="auth-foot">Уже есть аккаунт? <a href="/login" th:href="@{/login}">Войти</a></p>
        </form>

        <p class="auth-motto">— ТВОЙ ЧЕЛОВЕК. ТВОЙ ВАЙБ. —</p>
      </section>

    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span>© 2026 swipely 18+ · Только для совершеннолетних</span>
        <div class="footer-links">
          <a href="/privacy" th:href="@{/privacy}">Конфиденциальность</a>
          <a href="/terms" th:href="@{/terms}">Условия</a>
        </div>
      </div>
    </footer>

  </body>
</html>
