<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>Войти — swipely</title>
    <link href="/css/styles.css" rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script defer="" th:src="@{/js/site.js}"></script>
  </head>

  <body>

    <header class="header">
      <div class="header-inner">
        <a class="brand" href="/" th:href="@{/}"><span class="brand-mark">♡</span>swipely</a>
        <a href="/" style="color:var(--muted);font-size:12px" th:href="@{/}">← На главную</a>
      </div>
    </header>

    <main class="app-main container">
      <p class="notice" role="alert" th:if="${error}" th:text="${error}"></p>
      <p class="notice" role="status" th:if="${notice}" th:text="${notice}"></p>
      <h1>Не удалось выполнить действие.</h1>
      <p><a class="button" th:href="@{/discover}">К анкетам</a> <a class="button outline" th:href="@{/login}">Войти</a></p>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span>© 2026 swipely 18+ · Только для совершеннолетних</span>
        <div class="footer-links">
          <a href="/privacy" th:href="@{/privacy}">Конфиденциальность</a>
          <a href="/terms" th:href="@{/terms}">Условия</a>
        </div>
      </div>
    </footer>

  </body>
</html>
