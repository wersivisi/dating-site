<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>Новый пароль — swipely</title>
    <link href="/css/styles.css" rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script defer="" th:src="@{/js/site.js}"></script>
  </head>

  <body>

    <header class="header">
      <div class="header-inner">
        <a class="brand" href="/" th:href="@{/}"><span class="brand-mark">♡</span>swipely</a>
        <a href="/" style="color:var(--muted);font-size:12px" th:href="@{/}">← На главную</a>
      </div>
    </header>

    <main class="auth-wrap">
      <p class="notice" role="alert" th:if="${error}" th:text="${error}"></p>
      <p class="notice" role="status" th:if="${notice}" th:text="${notice}"></p>

      <section class="auth-card">
        <p class="eyebrow">✦ НОВЫЙ ПАРОЛЬ</p>
        <h1>НОВЫЙ ПАРОЛЬ. НОВЫЙ СТАРТ.</h1>
        <p class="notice">Отправка почты и обращений пока недоступна.</p>

        <form class="auth-form" method="post" th:action="@{/reset-password}">
          <label>
            Новый пароль
            <input autocomplete="new-password" minlength="8" name="password" placeholder="Придумайте пароль" required="" type="password"/>
          </label>
          <small style="color:var(--muted)">Не менее 8 символов, включая буквы и цифры.</small>
          <label>
            Повторите пароль
            <input autocomplete="new-password" minlength="8" name="password-confirm" placeholder="Введите пароль ещё раз" required="" type="password"/>
          </label>
          <button class="button" type="submit">Сохранить пароль</button>
        </form>

        <p class="auth-motto">— ТВОЙ ЧЕЛОВЕК. ТВОЙ ВАЙБ. —</p>
      </section>

    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span>© 2026 swipely 18+ · Только для совершеннолетних</span>
        <div class="footer-links">
          <a href="/privacy" th:href="@{/privacy}">Конфиденциальность</a>
          <a href="/terms" th:href="@{/terms}">Условия</a>
        </div>
      </div>
    </footer>

  </body>
</html>
