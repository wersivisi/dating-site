<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Новый пароль — swipely</title>
  <!-- Подключение таблицы стилей -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ШАПКА СТРАНИЦЫ АВТОРИЗАЦИИ -->
  <header class="header">
    <div class="header-inner">
      <!-- Навигация: Главная страница (логотип) -->
      <a class="brand" href="index.html">
        <span class="brand-mark">♡</span>swipely
      </a>
      <!-- Ссылка возврата на главную страницу -->
      <a href="index.html" style="color:var(--muted);font-size:12px">← На главную</a>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ: ФОРМА СМЕНЫ ПАРОЛЯ -->
  <main class="auth-wrap">
    <section class="auth-card">
      <p class="eyebrow">✦ НОВЫЙ ПАРОЛЬ</p>
      <h1>НОВЫЙ ПАРОЛЬ. НОВЫЙ СТАРТ.</h1>
      
      <!-- 
        ФОРМА УСТАНОВКИ НОВОГО ПАРОЛЯ 
        (POST-запрос для обновления учетных данных) 
      -->
      <form class="auth-form" method="post">
        
        <!-- Поле ввода нового пароля (Параметр: password) -->
        <label>Новый пароль
          <input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Придумайте пароль">
        </label>
        <small style="color:var(--muted)">Не менее 8 символов, включая буквы и цифры.</small>
        
        <!-- Поле подтверждения пароля (Параметр: password-confirm) -->
        <label>Повторите пароль
          <input name="password-confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="Введите пароль ещё раз">
        </label>
        
        <!-- Кнопка отправки POST-запроса для сохранения пароля -->
        <button class="button" type="submit">Сохранить пароль</button>
      </form>

      <p class="auth-motto">— ТВОЙ ЧЕЛОВЕК. ТВОЙ ВАЙБ. —</p>
    </section>
  </main>

  <!-- ПОДВАЛ СТРАНИЦЫ -->
  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 swipely  18+ · Только для совершеннолетних</span>
      <div class="footer-links">
        <!-- Ссылка: Политика конфиденциальности -->
        <a href="privacy.html">Конфиденциальность</a>
        <!-- Ссылка: Условия использования -->
        <a href="terms.html">Условия</a>
      </div>
    </div>
  </footer>

</body>
</html>
