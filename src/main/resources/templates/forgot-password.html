<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Восстановление пароля — swipely</title>
  <!-- Подключение таблицы стилей -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ШАПКА СТРАНИЦЫ АВТОРИЗАЦИИ -->
  <header class="header">
    <div class="header-inner">
      <!-- Ссылка на главную страницу (логотип) -->
      <a class="brand" href="index.html"><span class="brand-mark">♡</span>swipely</a>
      <!-- Ссылка возврата на главную страницу -->
      <a href="index.html" style="color:var(--muted);font-size:12px">← На главную</a>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ: ФОРМА ВОССТАНОВЛЕНИЯ -->
  <main class="auth-wrap">
    <section class="auth-card">
      <p class="eyebrow">✦ ВЕРНЁМСЯ НА ТВОЮ ВОЛНУ</p>
      <h1>ЗАБЫЛИ ПАРОЛЬ?</h1>
      <p>Ничего страшного. Укажи почту аккаунта — мы отправим ссылку для восстановления.</p>
      
      <!-- 
        ФОРМА ВОССТАНОВЛЕНИЯ ПАРОЛЯ 
        (POST-запрос для отправки инструкции на email) 
      -->
      <form class="auth-form" method="post">
        <!-- Поле ввода электронной почты (Параметр: email) -->
        <label>Электронная почта
          <input name="email" type="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        
        <!-- Кнопка отправки POST-запроса -->
        <button class="button" type="submit">Отправить ссылку ↗</button>
        
        <!-- Ссылка на возврат к форме входа -->
        <p class="auth-foot">Вспомнили пароль? <a href="login.html">Войти</a></p>
      </form>

      <p class="auth-motto">— ТВОЙ ЧЕЛОВЕК. ТВОЙ ВАЙБ. —</p>
    </section>
  </main>

  <!-- ПОДВАЛ СТРАНИЦЫ -->
  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 swipely  18+ · Только для совершеннолетних</span>
      <div class="footer-links">
        <!-- Ссылка: Политикой конфиденциальности -->
        <a href="privacy.html">Конфиденциальность</a>
        <!-- Ссылка: Условия использования -->
        <a href="terms.html">Условия</a>
      </div>
    </div>
  </footer>

</body>
</html>
