<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Симпатии — swipely</title><link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}"></head><body><header class="header"><div class="header-inner"><a class="brand" href="/" th:href="@{/}"><span class="brand-mark">♡</span>swipely</a><nav class="app-nav"><a href="/discover" th:href="@{/discover}">Анкеты</a><a class="active" href="/likes" th:href="@{/likes}">Симпатии</a><a href="/messages" th:href="@{/messages}">Сообщения</a></nav><a class="user-nav" href="/my-profile" th:href="@{/my-profile}"><span class="avatar">♡</span>Мой профиль⌄</a></div></header><main class="app-main container"><p class="notice" role="alert" th:if="${error}" th:text="${error}"></p><p class="notice" role="status" th:if="${notice}" th:text="${notice}"></p><div class="heading"><h1>ТВОИ СИМПАТИИ.</h1></div><nav class="tabs"><a th:classappend="${tab == 'mutual'} ? 'active'" th:href="@{/likes(tab='mutual')}">Взаимные</a><a th:classappend="${tab == 'incoming'} ? 'active'" th:href="@{/likes(tab='incoming')}">Нравлюсь</a><a th:classappend="${tab == 'outgoing'} ? 'active'" th:href="@{/likes(tab='outgoing')}">Мои симпатии</a></nav><p class="notice" th:if="${#lists.isEmpty(profiles)}">Здесь пока нет симпатий. <a th:href="@{/discover}">Посмотреть анкеты</a></p><div class="profile-grid"><article class="person-card" th:each="person : ${profiles}"><a class="person-photo" th:href="@{/profile(userId=${person.userId})}"><img th:if="${person.avatarUrl}" th:src="@{${person.avatarUrl}}" alt="Фото пользователя"><span th:unless="${person.avatarUrl}" class="photo-placeholder">♡</span></a><div class="person-info"><h3 th:text="${person.displayName}"></h3><p th:text="${person.city}"></p><p th:text="${person.bio}"></p><div class="chips"><span th:text="${person.interests}"></span></div></div><a th:if="${tab == 'mutual'}" class="button card-cta" th:href="@{/conversation(userId=${person.userId})}">Начать разговор ↗</a><form th:if="${tab == 'incoming'}" method="post" th:action="@{/friends/{id}/accept(id=${person.userId})}"><button class="button card-cta">Ответить взаимностью</button></form><p th:if="${tab == 'outgoing'}" class="notice">Ожидаем ответа</p></article></div></main><footer class="footer"><div class="footer-inner"><span>© 2026 swipely　 18+ · Только для совершеннолетних</span><div class="footer-links"><a href="/safety" th:href="@{/safety}">Безопасность</a><a href="/help" th:href="@{/help}">Помощь</a></div></div></footer></body></html>
