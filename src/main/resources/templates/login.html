<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Войти — swipely</title>
  <!-- Подключение таблицы стилей -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ШАПКА СТРАНИЦЫ АВТОРИЗАЦИИ -->
  <header class="header">
    <div class="header-inner">
      <!-- Навигация: Главная страница (логотип) -->
      <a class="brand" href="index.html">
        <span class="brand-mark">♡</span>swipely
      </a>
      <!-- Ссылка возврата на главную страницу -->
      <a href="index.html" style="color:var(--muted);font-size:12px">← На главную</a>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ: ФОРМА ВХОДА -->
  <main class="auth-wrap">
    <section class="auth-card">
      <p class="eyebrow">✦ СНОВА НА СВОЕЙ ВОЛНЕ</p>
      <h1>ВОЙТИ</h1>
      <p>Рады видеть тебя снова. Продолжим твою историю?</p>
      
      <!-- 
        ФОРМА АУТЕНТИФИКАЦИИ 
        (POST-запрос для передачи учетных данных пользователя) 
      -->
      <form class="auth-form" method="post">
        <!-- Поле ввода электронной почты (Параметр: email) -->
        <label>Электронная почта
          <input name="email" type="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        
        <!-- Поле ввода пароля (Параметр: password) -->
        <label>Пароль
          <input name="password" type="password" required autocomplete="current-password" placeholder="Введите пароль">
        </label>
        
        <!-- Ссылка на страницу восстановления пароля -->
        <a class="text-link" href="forgot-password.html" style="justify-self:end">Забыли пароль?</a>
        
        <!-- Кнопка отправки POST-запроса авторизации -->
        <button class="button" type="submit">Войти ↗</button>
        
        <!-- Ссылка на форму регистрации для новых пользователей -->
        <p class="auth-foot">Ещё нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
      </form>

      <p class="auth-motto">— ТВОЙ ЧЕЛОВЕК. ТВОЙ ВАЙБ. —</p>
    </section>
  </main>

  <!-- ПОДВАЛ СТРАНИЦЫ -->
  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 swipely  18+ · Только для совершеннолетних</span>
      <div class="footer-links">
        <!-- Ссылка: Политика конфиденциальности -->
        <a href="privacy.html">Конфиденциальность</a>
        <!-- Ссылка: Условия использования -->
        <a href="terms.html">Условия</a>
      </div>
    </div>
  </footer>

</body>
</html>
