databaseChangeLog:
  - changeSet:
      id: 3
      author: wersiv
      changes:
        - createTable:
            tableName: friendships
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: requester_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: addressee_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: blocked_by
                  type: bigint
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: friendships
            baseColumnNames: requester_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_friendships_requester
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: friendships
            baseColumnNames: addressee_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_friendships_addressee
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: friendships
            columnNames: requester_id, addressee_id
            constraintName: uq_friendships_pair
