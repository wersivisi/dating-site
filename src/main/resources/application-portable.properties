spring.datasource.url=jdbc:h2:file:./data/swipely;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
server.address=127.0.0.1
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
app.upload.avatar-dir=./data/avatars
app.portable.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-portable.yaml
